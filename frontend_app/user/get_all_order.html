    /*
    |--------------------------------------------------------------------------
    | FETCH AND RENDER ORDERS
    |--------------------------------------------------------------------------
    */

    async function fetchAndRenderOrders(
        isRealtime = false
    ) {

        console.log(
            "fetchAndRenderOrders() called"
        );


        const user =
            auth.currentUser;


        /*
        User not logged in.
        */

        if (!user) {

            console.log(
                "No authenticated Firebase user."
            );

            return;

        }


        try {

            /*
            Show loading only for normal
            page loading, not realtime refresh.
            */

            if (!isRealtime) {

                showLoading();

            }


            /*
            Get fresh Firebase ID token.
            */

            const idToken =
                await user.getIdToken(true);


            console.log(
                "Firebase token received."
            );


            /*
            Call backend.
            */

            const response =
                await fetch(
                    API_URL,
                    {

                        method: "GET",

                        headers: {

                            "Authorization":
                                `Bearer ${idToken}`

                        }

                    }
                );


            console.log(
                "Order API status:",
                response.status
            );


            /*
            Backend error.
            */

            if (!response.ok) {

                let errorMessage =
                    `HTTP ${response.status}`;


                try {

                    const errorData =
                        await response.json();


                    if (
                        errorData.message
                    ) {

                        errorMessage =
                            errorData.message;

                    }

                } catch (error) {

                    console.log(
                        "Unable to parse error response."
                    );

                }


                throw new Error(
                    errorMessage
                );

            }


            /*
            Get JSON.
            */

            const orders =
                await response.json();


            console.log(
                "Orders received:",
                orders
            );


            /*
            Validate response.
            */

            if (
                !Array.isArray(orders)
            ) {

                throw new Error(
                    "Invalid orders response from server."
                );

            }


            /*
            No orders.
            */

            if (
                orders.length === 0
            ) {

                ordersContainer.innerHTML = `

                    <div
                        class="bg-white rounded-2xl shadow-sm
                        text-center py-16 px-5"
                    >

                        <i
                            class="fa-solid fa-box-open
                            text-5xl text-gray-300 mb-5"
                        ></i>

                        <h2
                            class="text-xl font-semibold text-gray-700"
                        >

                            No orders found

                        </h2>

                        <p
                            class="text-gray-500 mt-2"
                        >

                            You have not placed any orders yet.

                        </p>

                    </div>

                `;

                return;

            }


            /*
            Render orders.
            */

            renderOrders(
                orders
            );


        } catch (error) {

            console.error(
                "Order fetch error:",
                error
            );


            showError(
                error.message ||
                "Error loading orders."
            );

        }

    }



    /*
    |--------------------------------------------------------------------------
    | RENDER ORDERS
    |--------------------------------------------------------------------------
    */

    function renderOrders(
        orders
    ) {

        ordersContainer.innerHTML = "";


        orders.forEach(
            (order) => {

                const orderHTML =
                    createOrderHTML(
                        order
                    );


                ordersContainer.insertAdjacentHTML(
                    "beforeend",
                    orderHTML
                );

            }
        );

    }

    /*
    |--------------------------------------------------------------------------
    | DOWNLOAD INVOICE
    |--------------------------------------------------------------------------
    */

    async function downloadInvoice(
        orderId,
        button
    ) {

        console.log(
            "Invoice requested:",
            orderId
        );


        try {

            /*
            Check user.
            */

            const user =
                auth.currentUser;


            if (!user) {

                alert(
                    "Please login again."
                );

                window.location.href =
                    "user_login.html";

                return;

            }


            /*
            Check order ID.
            */

            if (!orderId) {

                alert(
                    "Order ID is missing."
                );

                return;

            }


            /*
            Get fresh Firebase token.
            */

            const idToken =
                await user.getIdToken(true);


            /*
            Disable button.
            */

            if (button) {

                button.disabled = true;

                button.classList.add(
                    "opacity-60",
                    "cursor-not-allowed"
                );


                button.innerHTML = `

                    <i
                        class="fa-solid
                        fa-spinner
                        fa-spin"
                    ></i>

                    Generating...

                `;

            }


            /*
            ============================================================
            FINAL INVOICE REQUEST
            ============================================================

            POST

            /generate/invoice/of/order

            Body:

            {
                "order_id": "..."
            }
            */

            const response =
                await fetch(
                    INVOICE_API_URL,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                `Bearer ${idToken}`

                        },

                        body:
                            JSON.stringify({

                                order_id:
                                    orderId

                            })

                    }
                );


            console.log(
                "Invoice API status:",
                response.status
            );


            /*
            Backend error.
            */

            if (!response.ok) {

                let errorMessage =
                    "Unable to generate invoice.";


                try {

                    const contentType =
                        response.headers.get(
                            "content-type"
                        );


                    if (
                        contentType &&
                        contentType.includes(
                            "application/json"
                        )
                    ) {

                        const errorData =
                            await response.json();


                        errorMessage =
                            errorData.message ||
                            errorMessage;

                    }

                } catch (error) {

                    console.error(
                        "Invoice error response:",
                        error
                    );

                }


                throw new Error(
                    errorMessage
                );

            }


            /*
            Get PDF.
            */

            const blob =
                await response.blob();


            if (
                !blob ||
                blob.size === 0
            ) {

                throw new Error(
                    "Invoice PDF is empty."
                );

            }


            /*
            Create temporary URL.
            */

            const blobURL =
                window.URL.createObjectURL(
                    blob
                );


            /*
            Create download link.
            */

            const link =
                document.createElement(
                    "a"
                );


            link.href =
                blobURL;


            link.download =
                `MadHut-Invoice-${orderId}.pdf`;


            document.body.appendChild(
                link
            );


            link.click();


            link.remove();


            /*
            Cleanup.
            */

            setTimeout(
                () => {

                    window.URL.revokeObjectURL(
                        blobURL
                    );

                },
                1000
            );


        } catch (error) {

            console.error(
                "Invoice download error:",
                error
            );


            alert(
                error.message ||
                "Something went wrong while downloading invoice."
            );


        } finally {

            /*
            Restore button.
            */

            if (button) {

                button.disabled = false;

                button.classList.remove(
                    "opacity-60",
                    "cursor-not-allowed"
                );


                button.innerHTML = `

                    <i
                        class="fa-solid
                        fa-file-invoice"
                    ></i>

                    Download Invoice

                `;

            }

        }

    }



    /*
    |--------------------------------------------------------------------------
    | COPY TRACKING ID
    |--------------------------------------------------------------------------
    */

    async function copyTracking(
        trackingId
    ) {

        try {

            await navigator.clipboard.writeText(
                trackingId
            );


            alert(
                "Tracking ID copied."
            );


        } catch (error) {

            console.error(
                "Copy error:",
                error
            );


            alert(
                "Unable to copy Tracking ID."
            );

        }

    }



    /*
    |--------------------------------------------------------------------------
    | OPEN REVIEW
    |--------------------------------------------------------------------------
    */

    function openReview(
        productId,
        orderId
    ) {

        if (!productId) {

            alert(
                "Product ID is missing."
            );

            return;

        }


        window.location.href =
            `review.html?product_id=${encodeURIComponent(
                productId
            )}&order_id=${encodeURIComponent(
                orderId
            )}`;

    }



    /*
    |--------------------------------------------------------------------------
    | ORDER STATUS COLOR
    |--------------------------------------------------------------------------
    */

    function getStatusColor(
        status
    ) {

        if (!status) {

            return "bg-gray-100 text-gray-600";

        }


        const value =
            String(status)
                .toLowerCase();


        switch (value) {

            case "pending":

                return "bg-red-100 text-red-600";


            case "processing":

                return "bg-yellow-100 text-yellow-600";


            case "confirmed":

                return "bg-indigo-100 text-indigo-600";


            case "dispatch":

                return "bg-blue-100 text-blue-600";


            case "shipped":

                return "bg-blue-100 text-blue-600";


            case "delivered":

                return "bg-green-100 text-green-600";


            case "cancelled":

                return "bg-red-100 text-red-600";


            case "canceled":

                return "bg-red-100 text-red-600";


            default:

                return "bg-gray-100 text-gray-600";

        }

    }



    /*
    |--------------------------------------------------------------------------
    | FORMAT DATE
    |--------------------------------------------------------------------------
    */

    function formatDate(
        value
    ) {

        if (!value) {

            return "Date unavailable";

        }


        try {

            const date =
                new Date(value);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "Date unavailable";

            }


            return date.toLocaleString(
                "en-IN",
                {

                    day: "2-digit",

                    month: "short",

                    year: "numeric",

                    hour: "2-digit",

                    minute: "2-digit"

                }
            );

        } catch (error) {

            return "Date unavailable";

        }

    }



    /*
    |--------------------------------------------------------------------------
    | ESCAPE HTML
    |--------------------------------------------------------------------------
    */

    function escapeHTML(
        value
    ) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }



    /*
    |--------------------------------------------------------------------------
    | ESCAPE JAVASCRIPT
    |--------------------------------------------------------------------------
    */

    function escapeJS(
        value
    ) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(value)
            .replace(
                /\\/g,
                "\\\\"
            )
            .replace(
                /'/g,
                "\\'"
            )
            .replace(
                /"/g,
                '\\"'
            )
            .replace(
                /\n/g,
                "\\n"
            )
            .replace(
                /\r/g,
                "\\r"
            );

    }



    /*
    |--------------------------------------------------------------------------
    | LOGOUT
    |--------------------------------------------------------------------------
    */

    logoutBtn.addEventListener(
        "click",
        async () => {

            try {

                await signOut(
                    auth
                );


                window.location.href =
                    "user_login.html";


            } catch (error) {

                console.error(
                    "Logout error:",
                    error
                );


                alert(
                    "Unable to logout."
                );

            }

        }
    );



    /*
    |--------------------------------------------------------------------------
    | MAKE FUNCTIONS GLOBAL
    |--------------------------------------------------------------------------
    |
    | This is important because buttons use onclick=""
    |
    */

    window.fetchAndRenderOrders =
        fetchAndRenderOrders;


    window.downloadInvoice =
        downloadInvoice;


    window.copyTracking =
        copyTracking;


    window.openReview =
        openReview;



    /*
    |--------------------------------------------------------------------------
    | SOCKET.IO
    |--------------------------------------------------------------------------
    */

    const socket =
        io(
            "https://madhut-qeqj.onrender.com"
        );


    socket.on(
        "connect",
        () => {

            console.log(
                "Socket.IO connected:",
                socket.id
            );

        }
    );


    socket.on(
        "order_updated",
        () => {

            console.log(
                "Order updated. Refreshing orders..."
            );


            fetchAndRenderOrders(
                true
            );

        }
    );



    /*
    |--------------------------------------------------------------------------
    | FIREBASE AUTH STATE
    |--------------------------------------------------------------------------
    |
    | IMPORTANT:
    |
    | fetchAndRenderOrders is already defined
    | BEFORE this callback runs.
    |
    */

    /*
    |--------------------------------------------------------------------------
    | FIREBASE AUTH STATE
    |--------------------------------------------------------------------------
    |
    | IMPORTANT:
    | Do NOT redirect automatically from this page when there is no user.
    | The login page is responsible for authentication.
    |
    | This prevents an authentication redirect loop.
    |
    */

    onAuthStateChanged(
        auth,
        async (user) => {

            console.log(
                "Firebase auth state changed:",
                user
                    ? user.email
                    : "No authenticated user"
            );


            /*
            |------------------------------------------------------------------
            | User is NOT authenticated
            |------------------------------------------------------------------
            |
            | Stay on this page and show a clear login message.
            | We do not redirect here because redirecting between auth pages
            | can create an infinite reload loop.
            |
            */

            if (!user) {

                ordersContainer.innerHTML = `

                    <div
                        class="bg-white rounded-2xl shadow-sm
                        text-center py-16 px-5"
                    >

                        <i
                            class="fa-solid fa-lock
                            text-5xl text-gray-300 mb-5"
                        ></i>

                        <h2
                            class="text-xl font-semibold text-gray-700"
                        >
                            Please login to view your orders
                        </h2>

                        <p class="text-gray-500 mt-2">
                            Your login session is not active.
                        </p>

                        <button
                            type="button"
                            id="goToLoginBtn"
                            class="mt-6 inline-flex items-center gap-2
                            bg-black text-white px-5 py-2.5
                            rounded-lg font-medium hover:bg-gray-800"
                        >
                            <i class="fa-solid fa-right-to-bracket"></i>
                            Login
                        </button>

                    </div>

                `;


                const goToLoginBtn =
                    document.getElementById(
                        "goToLoginBtn"
                    );


                if (goToLoginBtn) {

                    goToLoginBtn.addEventListener(
                        "click",
                        () => {

                            window.location.href =
                                "user_login.html";

                        }
                    );

                }


                return;

            }


            /*
            |------------------------------------------------------------------
            | User is authenticated
            |------------------------------------------x------------------------
            */

            await fetchAndRenderOrders();

        }
    );


</script>
